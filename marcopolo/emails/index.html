<script type="text/babel">
const RENDER = { A: window.renderA, B: window.renderB, C: window.renderC };
const OPTIONS = [
  { id: "A", title: "Option A · Cream & Pop", subtitle: "Airy cream base, ink type, accent color pops" },
  { id: "B", title: "Option B · Color Block", subtitle: "Full-color header band per email, reversed headline" },
  { id: "C", title: "Option C · Framed Sticker", subtitle: "Ink-bordered zine card, highlight marks, rotated stickers" },
];

function emailName(e) {
  return { welcome:"Welcome", why:"Why us", how:"How it works", proof:"Proof", urgency:"Urgency + offer", missed:"Missed it" }[e.kind] || e.kind;
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1600);
}

function EmailCard({ opt, email }) {
  const ref = React.useRef(null);
  const [copied, setCopied] = React.useState(false);

  const handleCopy = async () => {
    const el = ref.current;
    if (!el) return;
    // The email content is the first (and only) child of the frame.
    const inner = el.querySelector("[data-email-root]") || el.firstElementChild;
    if (!inner) return;
    // Build a self-contained email HTML doc so it can be pasted into an ESP or file.
    const doc =
`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>${email.subject.replace(/</g,"&lt;")}</title>
<meta name="description" content="${email.preheader.replace(/"/g,"&quot;")}">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body style="margin:0;padding:0;background:#efe7da;">
<span style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">${email.preheader.replace(/</g,"&lt;")}</span>
${inner.outerHTML}
</body>
</html>`;
    try {
      await navigator.clipboard.writeText(doc);
      setCopied(true);
      showToast("Copied " + opt.id + " · " + email.n + " " + emailName(email));
      setTimeout(() => setCopied(false), 1400);
    } catch (err) {
      showToast("Copy failed — check console");
      console.error(err);
    }
  };

  React.useLayoutEffect(() => {
    if (!ref.current) return;
    // tag the inner React-rendered root for a reliable copy target
    const first = ref.current.firstElementChild;
    if (first && !first.hasAttribute("data-email-root")) first.setAttribute("data-email-root", "");
  });

  return (
    <div className="card">
      <div className="card-head">
        <span className="card-label">{opt.id} · {email.n}. {emailName(email)} — <em style={{fontStyle:"normal",opacity:.7}}>{email.subject}</em></span>
        <button className={"copy-btn" + (copied ? " copied" : "")} onClick={handleCopy}>{copied ? "✓ Copied" : "Copy HTML"}</button>
      </div>
      <div className="email-frame" ref={ref}>
        {RENDER[opt.id](email)}
      </div>
    </div>
  );
}

function App() {
  return (
    <>
      {OPTIONS.map(o => (
        <div key={o.id}>
          <h2 className="section">{o.title}</h2>
          <p className="section-sub">{o.subtitle}</p>
          <div className="grid">
            {window.EMAILS.map(e => <EmailCard key={e.n} opt={o} email={e} />)}
          </div>
        </div>
      ))}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
